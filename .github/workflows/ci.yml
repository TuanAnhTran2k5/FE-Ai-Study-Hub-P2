name: Frontend CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - TuanAnh-FE
      - 'feature/**'
      - 'ci/**'
  pull_request:
    branches:
      - main
      - master
      - TuanAnh-FE
  workflow_dispatch:
    inputs:
      reason:
        description: 'Lý do chạy thủ công'
        required: false
        default: 'Manual test'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=https://aistudyhub.cloud/api
            VITE_GOOGLE_CLIENT_ID=852155010975-aree4h5ahmtj2k69o7ruafnj9crp3kq7.apps.googleusercontent.com
            VITE_SYSTEM_ADMIN_EMAIL=aistudyhub062026@gmail.com
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fe-ai-study-hub:latest
            ${{ secrets.DOCKER_USERNAME }}/fe-ai-study-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
